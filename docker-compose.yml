version: '3.8'

services:
  rag-assistant:
    build: .
    container_name: engineering-rag-assistant
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - RETRIEVAL_MODE=hybrid
      - RRF_K=60
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
